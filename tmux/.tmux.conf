# ── General ──────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s escape-time 0
set -g mouse on

# Start windows/panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# ── Prefix key: Ctrl+A ───────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Splits (vim-style) ───────────────────────────────────────────────
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# New windows preserve directory
bind c new-window -a -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"

# ── Pane navigation ─────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Vi copy mode ─────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection
set -g allow-passthrough on
set -s set-clipboard on
setw -g mode-style 'fg=#1F1F28,bg=#7E9CD8'

# ── Window naming & swapping ─────────────────────────────────────────
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
bind -r Left swap-window -t -1 \; select-window -t -1
bind -r Right swap-window -t +1 \; select-window -t +1

# ── Agent notifications ─────────────────────────────────────────────
setw -g monitor-bell on
set -g bell-action other
setw -g window-status-bell-style 'fg=#C8C093 dotted-underscore'

# ── Extended keys passthrough ────────────────────────────────────────
set -g extended-keys on
set -g extended-keys-format csi-u

# ── Quick reload config ─────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ── Status bar (Kanagawa, minimal pills) ──────────────────────────────
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-style 'bg=#16161D,fg=#DCD7BA'

# Left: session icon + name
set -g status-left-length 30
set -g status-left-style 'fg=#16161D,bg=#16161D'
set -g status-left '#[fg=#C8C093]  #[fg=#DCD7BA,bold]#S #[fg=#54546D]│ '

# Window tabs — active gets a purple pill number
setw -g window-status-separator ' '
setw -g window-status-format '#[fg=#54546D]#I #[fg=#727169]#W '
setw -g window-status-style 'bg=#16161D,fg=#727169'
setw -g window-status-current-format '#[fg=#16161D,bg=#957FB8,bold] #I #[fg=#957FB8,bg=#16161D,nobold] #[fg=#DCD7BA,bold]#W '
setw -g window-status-current-style 'bg=#16161D,fg=#957FB8,bold'
setw -g window-status-activity-style 'bg=#16161D,fg=#FFA066,bold'

# Pane borders
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#54546D'
set -g pane-active-border-style 'fg=#957FB8'

# Message/command line
set -g message-style 'fg=#DCD7BA,bg=#252535'
set -g message-command-style 'fg=#DCD7BA,bg=#252535'

# ── Plugins ──────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# ── Initialize TPM (keep at bottom) ─────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'