# ── General ──────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s escape-time 0
set -g mouse on

# Start windows/panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# ── Prefix key: Ctrl+A ───────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Splits (vim-style) ───────────────────────────────────────────────
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# New windows preserve directory
bind c new-window -a -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"

# ── Pane navigation ─────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Vi copy mode ─────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection
set -g allow-passthrough on
set -s set-clipboard on
 setw -g mode-style 'fg=#1e1e2e,bg=#89b4fa'

# ── Window naming & swapping ─────────────────────────────────────────
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
bind -r Left swap-window -t -1 \; select-window -t -1
bind -r Right swap-window -t +1 \; select-window -t +1

# ── Agent notifications ─────────────────────────────────────────────
setw -g monitor-bell on
set -g bell-action other
 setw -g window-status-bell-style 'fg=#f9e2af dotted-underscore'

# ── Extended keys passthrough ────────────────────────────────────────
set -g extended-keys on
set -g extended-keys-format csi-u

# ── Quick reload config ─────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ── Status bar (Catppuccin Mocha, minimal pills) ────────────────────
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'

# Left: session icon + name
set -g status-left-length 30
set -g status-left-style 'fg=#1e1e2e,bg=#1e1e2e'
set -g status-left '#[fg=#f9e2af]  #[fg=#cdd6f4,bold]#S #[fg=#6c7086]│ '

# Right: empty
set -g status-right ''

# Window tabs — active gets a mauve pill number
setw -g window-status-separator ' '
setw -g window-status-format '#[fg=#6c7086]#I #[fg=#a6adc8]#W '
setw -g window-status-style 'bg=#1e1e2e,fg=#a6adc8'
setw -g window-status-current-format '#[fg=#1e1e2e,bg=#cba6f7,bold] #I #[fg=#cba6f7,bg=#1e1e2e,nobold] #[fg=#cdd6f4,bold]#W '
setw -g window-status-current-style 'bg=#1e1e2e,fg=#cba6f7,bold'
setw -g window-status-activity-style 'bg=#1e1e2e,fg=#fab387,bold'

# Pane borders
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#6c7086'
set -g pane-active-border-style 'fg=#cba6f7'

# Message/command line
set -g message-style 'fg=#cdd6f4,bg=#313244'
set -g message-command-style 'fg=#cdd6f4,bg=#313244'

# ── Plugins ──────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

# ── Plugin config ─────────────────────────────────────────────────────
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'
set -g @sessionx-bind 'o'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'

# ── Initialize TPM (keep at bottom) ─────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'