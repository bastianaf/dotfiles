# ── General ──────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s escape-time 0
set -g mouse on

# Start windows/panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# ── Prefix key: Ctrl+Space ──────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Splits (vim-style) ───────────────────────────────────────────────
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# New windows preserve directory
bind c new-window -a -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"

# ── Pane navigation ─────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Vi copy mode ─────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection
set -g allow-passthrough on
set -s set-clipboard on
setw -g mode-style 'fg=#1F1F28,bg=#7E9CD8'

# ── Window naming & swapping ─────────────────────────────────────────
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
bind -r Left swap-window -t -1 \; select-window -t -1
bind -r Right swap-window -t +1 \; select-window -t +1

# ── Agent notifications ─────────────────────────────────────────────
setw -g monitor-bell on
set -g bell-action other
setw -g window-status-bell-style 'fg=#C8C093 dotted-underscore'

# ── Extended keys passthrough ────────────────────────────────────────
set -g extended-keys on
set -g extended-keys-format csi-u

# ── F12 nested session toggle ────────────────────────────────────────
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=default,bg=#2D4F67" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S

set -g status-right '#([ $(tmux show-option -qv key-table) = "off" ] && echo " [OFF] ")'

# ── Quick reload config ─────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ── Status bar (Kanagawa theme) ──────────────────────────────────────
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=default'

set -g status-left-style 'fg=#1F1F28,bg=#957FB8,bold'
set -g status-left ' #S '
set -g status-left-length 20
set -g status-right ''

set -g pane-border-lines single
set -g pane-border-style 'fg=#54546D'
set -g pane-active-border-style 'fg=#957FB8'

setw -g window-status-separator ''
setw -g window-status-format '  #I:#W #F  '
setw -g window-status-style 'bg=default,fg=#C8C093'
setw -g window-status-current-format '  #I:#W #F  '
setw -g window-status-current-style 'bg=default,fg=#957FB8,bold'

# ── Plugins ──────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# ── Initialize TPM (keep at bottom) ─────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'